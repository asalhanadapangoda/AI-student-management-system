services:

  mysql:
    image: mysql:8.4
    container_name: student-management-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_management

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - student-management-network

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: student-management-backend
    restart: unless-stopped

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - student-management-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: student-management-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - student-management-network

volumes:
  mysql_data:

networks:
  student-management-network:
    driver: bridge
